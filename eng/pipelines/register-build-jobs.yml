parameters:
  runtimeRepoAlias: runtime
  performanceRepoAlias: self
  runtimeBranch: ''
  buildType: []
  mauiFramework: ''
  # repoName is forwarded into each register-build-job invocation so the
  # buildInfo.json marker lands under builds/{repoName}/buildArtifacts/...,
  # matching the layout written by upload-build-artifacts-job.yml. Defaults
  # to 'runtime' for back-compat with the existing dotnet/runtime perf-build
  # pipeline; callers from other tenants (e.g. dotnet/aspnetcore) pass
  # repoName explicitly.
  repoName: 'runtime'
  # sha is forwarded to each register-build-job so the buildInfo.json marker
  # lands under builds/{repoName}/buildArtifacts/{sha}/... Defaults to the self
  # repo commit; resource-built tenants (e.g. aspnetcore) pass the resource's
  # commit, e.g. sha: $(resources.repositories.aspnetcore.version).
  sha: '$(Build.SourceVersion)'

jobs:
- ${{ each type in parameters.buildType }}:
  - ${{ if and(eq(parameters.repoName, 'runtime'), in(type, 'wasm', 'mono_x64_linux', 'mono_arm64_linux', 'monoAot_x64_linux', 'monoAot_arm64_linux')) }}:
    - template: /eng/pipelines/templates/runtime-mono-jobs.yml@${{ parameters.performanceRepoAlias }}
      parameters:
        runtimeBranch: ${{ coalesce(parameters.runtimeBranch, variables['System.PullRequest.TargetBranch'], variables['Build.SourceBranch']) }}
        jobs:
        - template: /eng/pipelines/templates/register-build-job.yml@${{ parameters.performanceRepoAlias }}
          parameters:
            buildType: ${{ type }}
            buildId: $(Build.BuildId)
            repoName: ${{ parameters.repoName }}
            sha: ${{ parameters.sha }}
  - ${{ else }}:
    - template: /eng/pipelines/templates/register-build-job.yml@${{ parameters.performanceRepoAlias }}
      parameters:
        buildType: ${{ type }}
        buildId: $(Build.BuildId)
        repoName: ${{ parameters.repoName }}
        sha: ${{ parameters.sha }}
