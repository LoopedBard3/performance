# This contains all the wasm related perf jobs
parameters:
  runProfile: 'non-v8'
  downloadSpecificBuild: null # { buildId, pipeline, branchName, project }
  runtimeRepoAlias: runtime
  performanceRepoAlias: self
  jobParameters: {}

jobs:
- ${{ if and(eq(parameters.runProfile, 'v8'), not(startswith(variables['Build.SourceBranch'], 'refs/heads/release')), eq(parameters.downloadSpecificBuild.buildId, '')) }}:
  - template: /eng/pipelines/templates/runtime-wasm-build-jobs.yml@${{ parameters.performanceRepoAlias }}
    parameters:
      runtimeRepoAlias: ${{ parameters.runtimeRepoAlias }}

- ${{ if eq(parameters.runProfile, 'v8') }}:
  # Run CoreCLR WASM microbenchmarks perf job
  # Excluded on release branches — the wasm_coreclr build doesn't exist in older runtime branches.
  - ${{ if not(startswith(variables['Build.SourceBranch'], 'refs/heads/release')) }}:
    - template: /eng/pipelines/common/platform-matrix.yml@${{ parameters.runtimeRepoAlias }}
      parameters:
        jobTemplate: /eng/pipelines/templates/runtime-perf-job.yml@${{ parameters.performanceRepoAlias }}
        buildConfig: release
        runtimeFlavor: coreclr
        platforms:
        - linux_x64
        jobParameters:
          liveLibrariesBuildConfig: Release
          runtimeType: wasm_coreclr
          codeGenType: 'wasm'
          runKind: micro
          logicalMachine: 'perfviper'
          javascriptEngine: 'v8'
          additionalJobIdentifier: coreclr_v8
          downloadSpecificBuild: ${{ parameters.downloadSpecificBuild }}
          runtimeRepoAlias: ${{ parameters.runtimeRepoAlias }}
          performanceRepoAlias: ${{ parameters.performanceRepoAlias }}
          ${{ each parameter in parameters.jobParameters }}:
            ${{ parameter.key }}: ${{ parameter.value }}

  # Run CoreCLR WASM R2R microbenchmarks using the same runtime payload.
  # Browser WASM supports per-assembly R2R rather than composite R2R.
  - ${{ if not(startswith(variables['Build.SourceBranch'], 'refs/heads/release')) }}:
    - template: /eng/pipelines/common/platform-matrix.yml@${{ parameters.runtimeRepoAlias }}
      parameters:
        jobTemplate: /eng/pipelines/templates/runtime-perf-job.yml@${{ parameters.performanceRepoAlias }}
        buildConfig: release
        runtimeFlavor: coreclr
        platforms:
        - linux_x64
        jobParameters:
          liveLibrariesBuildConfig: Release
          runtimeType: wasm_coreclr
          codeGenType: 'wasm'
          r2rRunType: 'r2r'
          runKind: micro
          logicalMachine: 'perfviper'
          javascriptEngine: 'v8'
          additionalJobIdentifier: coreclr_r2r_v8
          downloadSpecificBuild: ${{ parameters.downloadSpecificBuild }}
          runtimeRepoAlias: ${{ parameters.runtimeRepoAlias }}
          performanceRepoAlias: ${{ parameters.performanceRepoAlias }}
          ${{ each parameter in parameters.jobParameters }}:
            ${{ parameter.key }}: ${{ parameter.value }}
