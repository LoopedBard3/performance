parameters:
  runtimeRepoAlias: runtime

jobs:
# The runtime-owned WASM wrapper also builds Mono; compose only its CoreCLR job.
- template: /eng/pipelines/common/platform-matrix.yml@${{ parameters.runtimeRepoAlias }}
  parameters:
    jobTemplate: /eng/pipelines/common/global-build-job.yml@${{ parameters.runtimeRepoAlias }}
    buildConfig: Release
    runtimeFlavor: coreclr
    platforms:
    - browser_wasm
    jobParameters:
      buildArgs: -s clr+libs+host+packs -c $(_BuildConfig) /p:AotHostArchitecture=x64 /p:AotHostOS=$(_hostedOS) /p:BuildHostTools=true /p:CrossBuildHostTools=true
      nameSuffix: wasm_coreclr
      isOfficialBuild: false
      postBuildSteps:
      - template: /eng/pipelines/performance/templates/perf-wasm-prepare-artifacts-steps.yml@${{ parameters.runtimeRepoAlias }}
        parameters:
          configForBuild: Release
          runtimeFlavor: coreclr
          artifactName: BrowserWasmCoreCLR
          sdkDirName: dotnet-none
          includeRefPack: false
          includeCoreClrToolchainPacks: true
